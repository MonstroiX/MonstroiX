<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Адаптивная страница с Grid и анимацией</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="main-header">
        <h1 class="title">Мой сайт</h1>
    </header>

    <nav>
        <ul class="menu">
            <li><a href="#">Главная</a></li>
            <li><a href="#">О нас</a></li>
            <li><a href="#">Контакты</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>О нас</h2>
            <p>Мы создаём красивые и современные сайты.</p>
        </section>

        <!-- Flex-контейнер -->
        <div class="flex-container">
            <div class="card">Карточка 1</div>
            <div class="card">Карточка 2</div>
            <div class="card">Карточка 3</div>
        </div>

        <!-- Grid-контейнер -->
        <section class="grid-gallery">
            <div class="grid-item">Блок 1</div>
            <div class="grid-item">Блок 2</div>
            <div class="grid-item">Блок 3</div>
            <div class="grid-item">Блок 4</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Моя компания</p>
    </footer>

</body>
</html>
