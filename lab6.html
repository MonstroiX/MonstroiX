<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Адаптивная страница с каруселью и формой</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header id="main-header">
    <h1 class="title">Мой сайт</h1>
  </header>

  <nav>
    <ul class="menu">
      <li><a href="#">Главная</a></li>
      <li><a href="#">О нас</a></li>
      <li><a href="#">Контакты</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h2>О нас</h2>
      <p>Мы создаём красивые и современные сайты.</p>
    </section>

    <!-- Flex-контейнер -->
    <div class="flex-container">
      <div class="card">Карточка 1</div>
      <div class="card">Карточка 2</div>
      <div class="card">Карточка 3</div>
    </div>

    <!-- Grid-контейнер -->
    <section class="grid-gallery">
      <div class="grid-item">Блок 1</div>
      <div class="grid-item">Блок 2</div>
      <div class="grid-item">Блок 3</div>
      <div class="grid-item">Блок 4</div>
    </section>

    <!-- Карусель -->
    <section>
      <h2>Карусель</h2>
      <div id="carousel-container" style="max-width: 600px; margin: 20px auto;"></div>
    </section>

    <!-- Форма -->
    <section>
      <h2>Форма регистрации</h2>
      <form id="registration-form" novalidate>
        <div class="form-group">
          <label for="name">Имя:</label>
          <input type="text" id="name" name="name" required />
          <small class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
          <small class="error-message"></small>
        </div>

        <div class="form-group">
          <label for="password">Пароль:</label>
          <input type="password" id="password" name="password" required />
          <small class="error-message"></small>
        </div>

        <button type="submit">Отправить</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Моя компания</p>
  </footer>

  <script src="carousel.js"></script>
  <script src="form-validation.js"></script>
  <script>
    createCarousel(
      [
        'https://picsum.photos/id/1018/600/400',
        'https://picsum.photos/id/1025/600/400',
        'https://picsum.photos/id/1037/600/400'
      ],
      '#carousel-container'
    );
  </script>
</body>
</html>
